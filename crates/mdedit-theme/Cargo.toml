[package]
name = "mdedit-theme"
description = "Design tokens, themes (TOML), typography, spacing, bundled fonts and icons"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["syntect"]
# Conversions to iced types, for the crates that draw.
iced = ["dep:iced"]
# `Theme::syntect_theme()` for fenced code highlighting.
syntect = ["dep:syntect"]

[dependencies]
directories.workspace = true
serde.workspace = true
syntect = { workspace = true, optional = true }
thiserror.workspace = true
toml.workspace = true
iced = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
