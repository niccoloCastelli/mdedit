[package]
name = "mdedit-app"
description = "A fast, lightweight, cross-platform markdown editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mdedit"
path = "src/main.rs"

[features]
push = ["mdedit-git/push"]

[dependencies]
mdedit-core.workspace = true
mdedit-render.workspace = true
mdedit-theme = { workspace = true, features = ["iced"] }
mdedit-project.workspace = true
mdedit-sidecar.workspace = true
mdedit-git.workspace = true
mdedit-export.workspace = true
mdedit-editor.workspace = true
mdedit-view.workspace = true
mdedit-mermaid.workspace = true
iced.workspace = true
rfd.workspace = true
tokio.workspace = true
serde.workspace = true
toml.workspace = true
directories.workspace = true
notify.workspace = true
image.workspace = true
jiff.workspace = true
similar.workspace = true
arboard.workspace = true

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true
jiff.workspace = true

# `make deb` (cargo-deb). Asset sources are relative to this crate; the
# hicolor glob keeps its size/category folders under the target directory.
# dpkg's triggers from shared-mime-info, hicolor-icon-theme and
# desktop-file-utils refresh the caches, so no maintainer scripts.
[package.metadata.deb]
name = "mdedit"
maintainer = "niccolo <nicco.castelli@gmail.com>"
copyright = "2026, niccolo <nicco.castelli@gmail.com>"
extended-description = """\
A fast, lightweight markdown editor with Edit, Split, View (WYSIWYG) and \
Read modes, large-file support, comments, git-backed projects and PDF/DOCX \
export."""
section = "editors"
priority = "optional"
depends = "$auto"
# winit and wgpu dlopen these at run time, so $auto cannot see them.
recommends = "libvulkan1, libxkbcommon-x11-0, libegl1"
assets = [
    ["target/release/mdedit", "usr/bin/", "755"],
    ["../../packaging/linux/mdedit.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/mdedit-mime.xml", "usr/share/mime/packages/mdedit.xml", "644"],
    ["../../packaging/linux/icons/hicolor/**/*", "usr/share/icons/hicolor/", "644"],
]
