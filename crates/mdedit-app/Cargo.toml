[package]
name = "mdedit-app"
description = "A fast, lightweight, cross-platform markdown editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mdedit"
path = "src/main.rs"

[features]
push = ["mdedit-git/push"]

[dependencies]
mdedit-core.workspace = true
mdedit-render.workspace = true
mdedit-theme = { workspace = true, features = ["iced"] }
mdedit-project.workspace = true
mdedit-sidecar.workspace = true
mdedit-git.workspace = true
mdedit-export.workspace = true
mdedit-editor.workspace = true
mdedit-view.workspace = true
iced.workspace = true
rfd.workspace = true
tokio.workspace = true
serde.workspace = true
toml.workspace = true
directories.workspace = true
notify.workspace = true
image.workspace = true
jiff.workspace = true
similar.workspace = true
arboard.workspace = true

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true
jiff.workspace = true
