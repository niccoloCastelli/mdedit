[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/mdedit-app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"

# Every third-party dependency the plan expects is declared here, so a
# workstream adds `foo.workspace = true` to its own crate instead of editing
# this file. Declared but unused entries cost nothing (they are not resolved
# until a crate uses them). Bump versions here, in one place.
[workspace.dependencies]
# Internal crates
mdedit-core = { path = "crates/mdedit-core" }
mdedit-render = { path = "crates/mdedit-render" }
mdedit-theme = { path = "crates/mdedit-theme" }
mdedit-project = { path = "crates/mdedit-project" }
mdedit-sidecar = { path = "crates/mdedit-sidecar" }
mdedit-git = { path = "crates/mdedit-git" }
mdedit-export = { path = "crates/mdedit-export" }
mdedit-editor = { path = "crates/mdedit-editor" }
mdedit-view = { path = "crates/mdedit-view" }

# GUI. `advanced` exposes the widget/renderer traits needed for custom widgets
# that only lay out what is visible; `canvas` for custom drawing; `tokio` runs
# async tasks off the UI thread; `svg` for Lucide icons (and math later);
# `image-without-codecs` draws images mdedit-view decodes itself.
iced = { version = "0.14", features = ["advanced", "canvas", "tokio", "svg", "image-without-codecs"] }
# Native open/save dialogs (XDG portal on Linux, no GTK dev headers needed).
rfd = "0.17"
# Embeds the app icon in the Windows exe (mdedit-app build.rs, Windows targets only).
winresource = { version = "0.1", default-features = false }
tokio = { version = "1", features = ["fs", "rt", "sync", "time"] }

# Core
# Default features off: line breaks are LF, CRLF and CR only (what
# CommonMark recognises), not the extra Unicode separators.
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
pulldown-cmark = { version = "0.13", default-features = false }
pulldown-cmark-escape = "0.11"
memmap2 = "0.9"
memchr = "2"
regex = "1"
regex-automata = "0.4"
unicode-segmentation = "1"
unicode-width = "0.2"
thiserror = "2"

# Data files
serde = { version = "1", features = ["derive"] }
toml = "1"
jiff = { version = "0.2", features = ["serde"] }
directories = "6"
sha2 = "0.11"
notify = "8"
notify-debouncer-full = "0.5"

# Git (pure Rust); git2 only behind mdedit-git's optional `push` feature.
gix = { version = "0.90", default-features = false, features = [
    "sha1",
    "max-performance",
    "status",
    "revision",
    "worktree-mutation",
    "credentials",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }
git2 = { version = "0.21", default-features = false }
# Line diffs for the history view (mdedit-app).
similar = "2"
# Reading pasted images (iced's clipboard is text only).
arboard = { version = "3", default-features = false, features = ["image-data"] }
keyring = "4"

# Export
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-svg = "0.15"
docx-rs = "0.4"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Dev
proptest = "1"
criterion = "0.8"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
